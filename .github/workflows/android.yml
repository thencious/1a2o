name: Android
on:
  workflow_dispatch:
  push:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check server address validation
        run: |
          mkdir -p "$RUNNER_TEMP/address-tests"
          javac -d "$RUNNER_TEMP/address-tests" apps/android/app/src/main/java/app/oneatwoo/ServerAddress.java apps/android/app/src/test/java/app/oneatwoo/ServerAddressTest.java
          java -cp "$RUNNER_TEMP/address-tests" app.oneatwoo.ServerAddressTest
      - name: Build and lint
        run: gradle -p apps/android --no-daemon assembleDebug lintDebug :app:testRelay
      - name: Build signed release
        if: env.HAS_ANDROID_SIGNING == 'true' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/1a2o-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle -p apps/android --no-daemon assembleRelease lintRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
      - name: Prepare APK
        run: |
          mkdir -p .context/artifacts
          if [ -f apps/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/android/app/build/outputs/apk/release/app-release.apk .context/artifacts/1a2o-android.apk
          else
            cp apps/android/app/build/outputs/apk/debug/app-debug.apk .context/artifacts/1a2o-android.apk
          fi
          sha256sum .context/artifacts/1a2o-android.apk > .context/artifacts/1a2o-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: 1a2o-android-apk
          path: .context/artifacts/1a2o-android.apk*
